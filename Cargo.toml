[package]
name = "keygate-esp-access-devices"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "keygate_esp_access_devices"
path = "src/lib.rs"

[[bin]]
name = "keygate-esp-access-devices"
path = "src/main.rs"

[dependencies]
# Embedded ecosystem
embedded-hal = "1.0"

# NFC - PN532 over I2C
pn532 = "0.5"
fugit = "0.3"
nb = "1.1"
void = { version = "1.0", default-features = false }

# Crypto - for NTAG 424 DNA authentication
aes = "0.8"
cmac = "0.7"

# Logging
log = "0.4"
heapless = "0.8"

# Serialization - no_std JSON
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

[target.'cfg(target_arch = "riscv32")'.dependencies]
# ESP32-C6 HAL and runtime
esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.19", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32c6", "auto"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "wifi", "unstable"] }
esp-alloc = { version = "0.10.0", features = ["global-allocator"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-radio", "esp-alloc", "esp32c6"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-sync = { version = "0.8.0" }
minimq = { version = "0.12.0", default-features = false }
static_cell = "2.1.0"

[package.metadata.espflash]
partition_table = "partitions.csv"

# OpenThread (Thread mesh) - uncomment when wiring up mesh
# openthread = { git = "https://github.com/esp-rs/openthread.git", features = ["esp-ieee802154"] }

[profile.dev]
debug = true
lto = "off"
opt-level = 1      # some optimization even in dev, bare metal needs it

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3

