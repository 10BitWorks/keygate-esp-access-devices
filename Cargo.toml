[package]
name = "keygate-esp-access-devices"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "keygate_esp_access_devices"
path = "src/lib.rs"

[[bin]]
name = "keygate-esp-access-devices"
path = "src/main.rs"
# The bin is bare-metal only (esp_hal/esp-rtos behind the target cfg) and cannot
# link on the host. Exclude it from `cargo test` so host unit tests (lib, piezo)
# can run; chip builds are unaffected.
test = false

[dependencies]
# Embedded ecosystem
embedded-hal = "1.0"

# NFC - PN532 over I2C
pn532 = { version = "0.5", features = ["msb-spi"] }
fugit = "0.3"
nb = "1.1"
void = { version = "1.0", default-features = false }

# Crypto - for NTAG 424 DNA authentication
aes = "0.8"
cmac = "0.7"

# Logging
log = "0.4"
heapless = "0.8"

# Serialization - no_std JSON
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

[features]
default = ["chip-esp32c6", "board-xiao-c6"]
chip-esp32c6 = ["dep:esp-hal", "esp-hal/esp32c6", "dep:esp-backtrace", "esp-backtrace/esp32c6", "dep:esp-println", "esp-println/esp32c6", "dep:esp-radio", "esp-radio/esp32c6", "dep:esp-rtos", "esp-rtos/esp32c6", "dep:esp-bootloader-esp-idf", "esp-bootloader-esp-idf/esp32c6", "dep:esp-storage", "esp-storage/esp32c6"]
chip-esp32 = ["dep:esp-hal", "esp-hal/esp32", "dep:esp-backtrace", "esp-backtrace/esp32", "dep:esp-println", "esp-println/esp32", "dep:esp-radio", "esp-radio/esp32", "dep:esp-rtos", "esp-rtos/esp32", "dep:esp-bootloader-esp-idf", "esp-bootloader-esp-idf/esp32", "dep:esp-storage", "esp-storage/esp32"]
board-xiao-c6 = []
board-esp32-devkit-door = []
# Bench diagnostics: wire-level spy (write frames, STATUS transitions, response dumps,
# poll heartbeat) on the door soft-SPI driver. See docs/PN532-SPI-NOTES.md. Not default.
nfc-spy = []
# Bench-only: executor-starvation injection (non-yielding spin in the cmd handler
# via {"wedge":true}) used to prove the dedicated RTC WDT feeder contract. Not in
# `default`; never built into a shipped/OTA image. See plan ota-stability.md task 8.
bench-wedge = []
# IRQ-driven PN532 readiness (door board ONLY: chip-esp32 + board-esp32-devkit-door).
# GPIO4 (P70_IRQ, meter-verified 2026-10-22) level-waits replace the pn532 crate's
# SPI STATREAD busy loops for every command ready-wait, embassy-bounded, with a
# mandatory one-STATREAD confirm per IRQ low (stale lows are expected — the PN532
# releases IRQ on SPI DW/DR). Default OFF: the default build's STATREAD path is
# untouched. Enabling is gated on bench matrix E1-E4 (docs/PN532-SPI-NOTES.md §6).
pn532-irq = []

[target.'cfg(any(target_arch = "riscv32", target_arch = "xtensa"))'.dependencies]
# ESP32 HAL and runtime
esp-hal = { version = "1.1", optional = true, features = ["unstable"] }
esp-storage = { version = "0.8", optional = true, default-features = false, features = ["critical-section"] }
embedded-storage = "0.3"
esp-backtrace = { version = "0.19", optional = true, features = ["panic-handler", "println", "custom-halt"] }
esp-println = { version = "0.17", optional = true, default-features = false, features = ["auto"] }
esp-radio = { version = "0.18.0", optional = true, features = ["wifi", "unstable"] }
esp-alloc = { version = "0.10.0", features = ["global-allocator"] }
esp-rtos = { version = "0.3.0", optional = true, features = ["embassy", "esp-radio", "esp-alloc"] }
esp-bootloader-esp-idf = { version = "0.5.0", optional = true }
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1", features = ["generic-queue-64"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1", default-features = false }
minimq = { version = "0.12.0", default-features = false }
static_cell = "2.1.0"

[dev-dependencies]
# Re-exposed on the host for piezo's overflow test (a real embassy channel is just
# a data structure here; the std backend makes CriticalSectionRawMutex lockable).
embassy-sync = "0.8.0"
critical-section = { version = "1.2", features = ["std"] }

[package.metadata.espflash]
partition_table = "partitions.csv"

# OpenThread (Thread mesh) - uncomment when wiring up mesh
# openthread = { git = "https://github.com/esp-rs/openthread.git", features = ["esp-ieee802154"] }

[profile.dev]
debug = true
lto = "off"
opt-level = 1      # some optimization even in dev, bare metal needs it

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3

