name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Run host library tests
        run: cargo test --lib

  firmware-c6:
    runs-on: ubuntu-latest
    env:
      WIFI_SSID: ci
      WIFI_PASS: ci
      MQTT_USER: ci
      MQTT_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and RISC-V target
        run: |
          rustup update stable && rustup default stable
          rustup target add riscv32imac-unknown-none-elf
      - name: Build C6 firmware
        run: cargo build --target riscv32imac-unknown-none-elf

  firmware-esp32:
    runs-on: ubuntu-latest
    env:
      WIFI_SSID: ci
      WIFI_PASS: ci
      MQTT_USER: ci
      MQTT_PASSWORD: ci
      RUSTUP_TOOLCHAIN: esp
    steps:
      - uses: actions/checkout@v4
      - name: Install espup
        run: cargo install espup --locked
      - name: Install esp toolchain for ESP32
        run: espup install --targets esp32
      - name: Build classic ESP32 door firmware
        run: |
          . "$HOME/export-esp.sh"
          cargo +esp build --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --no-default-features --features chip-esp32,board-esp32-devkit-door
